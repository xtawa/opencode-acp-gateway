[project]
name = "opencode-acp-gateway"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.142.2", "uvicorn==0.54.0", "httpx>=0.28,<1",
  "anyio>=4,<5", "cryptography>=46,<50", "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.12,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
