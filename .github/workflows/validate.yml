name: Validate gateway
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -e '.[dev]'
      - run: ruff check . && ruff format --check .
      - run: pytest -q
      - run: npm ci && npm test && npm run build
        working-directory: web
      - run: docker compose config --quiet
      - run: docker build -t acp-gateway-test .
      - name: Container health and bundled CLI
        run: |
          docker run -d --name acp-smoke -p 127.0.0.1:8080:8080 acp-gateway-test
          for attempt in $(seq 1 30); do
            if curl --fail http://127.0.0.1:8080/healthz; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:8080/
          docker exec acp-smoke /opt/opencode/node_modules/.bin/opencode --version
          docker exec acp-smoke test -s /data/bootstrap-token
          docker rm -f acp-smoke
